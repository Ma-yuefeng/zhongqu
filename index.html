<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PWR2000 爆炸拆解</title>
<style>
  :root {
    --bg: #e6ebf1;
    --panel: rgba(255, 255, 255, 0.94);
    --ink: #1c2430;
    --muted: #5d6b7c;
    --line: #d5dde6;
    --accent: #0e6e8a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", sans-serif; }
  #view { position: fixed; inset: 0; }
  #view canvas { display: block; width: 100%; height: 100%; }
  #labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  .tag {
    pointer-events: none;
    padding: 2px 7px;
    border-radius: 4px;
    background: rgba(255, 255, 255, 0.92);
    border: 1px solid var(--line);
    border-left-width: 3px;
    color: var(--ink);
    font-size: 12px;
    line-height: 1.4;
    white-space: nowrap;
    box-shadow: 0 1px 4px rgba(20, 32, 48, 0.08);
  }
  .tag.part { font-size: 11px; color: var(--muted); background: rgba(255, 255, 255, 0.8); }
  #panel {
    position: fixed;
    z-index: 5;
    top: 16px;
    left: 16px;
    width: 292px;
    padding: 16px 16px 14px;
    background: var(--panel);
    border: 1px solid rgba(255, 255, 255, 0.8);
    border-radius: 12px;
    box-shadow: 0 10px 30px rgba(28, 40, 58, 0.12);
  }
  h1 { margin: 0; font-size: 16px; font-weight: 640; letter-spacing: 0.01em; }
  .sub { margin: 4px 0 12px; color: var(--muted); font-size: 12px; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 8px 0; font-size: 13px; }
  .modes, .checks { display: grid; gap: 6px; margin: 8px 0 10px; }
  label { display: flex; align-items: center; gap: 6px; font-size: 13px; cursor: pointer; }
  input[type="range"] { width: 100%; accent-color: var(--accent); }
  .btns { display: flex; gap: 8px; margin: 10px 0 4px; }
  button {
    flex: 1;
    height: 32px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: #fff;
    color: var(--ink);
    font: inherit;
    font-size: 13px;
    cursor: pointer;
  }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button:disabled { opacity: 0.45; cursor: default; }
  #hint { margin: 8px 0 0; color: var(--muted); font-size: 12px; line-height: 1.5; }
  #mods { margin: 10px 0 0; padding: 0; list-style: none; max-height: 168px; overflow: auto; }
  #mods li { display: flex; align-items: center; gap: 8px; font-size: 12px; padding: 4px 6px; margin: 0 -6px; color: var(--ink); border-radius: 6px; cursor: pointer; }
  #mods li.on { background: #e5f3f6; }
  #mods i { width: 8px; height: 8px; border-radius: 50%; display: block; flex: none; }
  .tag.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  #info {
    position: fixed;
    z-index: 5;
    top: 16px;
    right: 16px;
    width: 300px;
    max-height: calc(100vh - 32px);
    overflow: auto;
    padding: 16px 16px 14px;
    background: var(--panel);
    border-radius: 12px;
    box-shadow: 0 10px 30px rgba(28, 40, 58, 0.12);
  }
  #info h2 { margin: 0; font-size: 18px; font-weight: 650; }
  #info .kind { margin: 6px 0 0; color: var(--accent); font-size: 12px; }
  #info .belong { margin: 4px 0 10px; color: var(--muted); font-size: 12px; }
  #info .body { margin: 0 0 12px; font-size: 13px; line-height: 1.55; }
  #info dl { margin: 0; display: grid; grid-template-columns: 72px 1fr; gap: 6px 8px; font-size: 12px; }
  #info dt { color: var(--muted); }
  #info dd { margin: 0; }
  #info .empty { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.55; }
  #info .actions { display: flex; gap: 8px; margin-top: 12px; }
  #info .actions button { flex: 1; }
  #loading {
    position: fixed;
    inset: 0;
    z-index: 9;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(230, 235, 241, 0.92);
  }
  #loading .box { width: 320px; }
  #loading strong { display: block; margin-bottom: 10px; font-size: 15px; }
  #bar { height: 6px; background: #d5dde6; border-radius: 99px; overflow: hidden; }
  #bar span { display: block; height: 100%; width: 0; background: var(--accent); }
  #loadtext { margin-top: 8px; color: var(--muted); font-size: 12px; }
  #loading.error strong { color: #9c2f2f; }
</style>
</head>
<body>
<div id="view"></div>
<aside id="panel">
  <h1>PWR2000 爆炸拆解</h1>
  <p class="sub" id="summary">正在读取模型…</p>
  <div class="row"><span>拆解程度</span><strong id="pct">0%</strong></div>
  <input id="amount" type="range" min="0" max="100" value="0" disabled />
  <div class="modes">
    <label><input type="radio" name="mode" value="module" disabled /> 按模块（7 个总成）</label>
    <label><input type="radio" name="mode" value="part" checked disabled /> 按零件（总成再拆开）</label>
  </div>
  <div class="checks">
    <label><input id="screws" type="checkbox" checked disabled /> 螺丝一起分离</label>
    <label><input id="names" type="checkbox" checked disabled /> 显示名称</label>
    <label><input id="spin" type="checkbox" disabled /> 自动旋转</label>
  </div>
  <div class="btns">
    <button id="play" class="primary" disabled>播放</button>
    <button id="reset" disabled>复位</button>
    <button id="fit" disabled>适配画面</button>
  </div>
  <p id="hint">点击零部件查看说明，选中后可单独展示。左键旋转，右键平移，滚轮缩放。空格播放，Esc 取消选中。</p>
  <ul id="mods"></ul>
</aside>
<aside id="info">
  <p class="empty" id="infoEmpty">点击模型上的零部件，这里显示它的名称和说明。</p>
  <div id="infoBody" hidden>
    <h2 id="infoName"></h2>
    <p class="kind" id="infoKind"></p>
    <p class="belong" id="infoBelong"></p>
    <p class="body" id="infoText"></p>
    <dl>
      <dt>外包尺寸</dt><dd id="infoSize"></dd>
      <dt>三角面</dt><dd id="infoTris"></dd>
      <dt>模型代号</dt><dd id="infoCode"></dd>
    </dl>
    <div class="actions">
      <button id="solo" type="button">单独展示</button>
      <button id="clearSel" type="button">取消选中</button>
    </div>
  </div>
</aside>
<div id="loading">
  <div class="box">
    <strong id="loadtitle">正在加载 PWR2000_摘盖.glb</strong>
    <div id="bar"><span id="barfill"></span></div>
    <div id="loadtext">0%</div>
  </div>
</div>
<script type="importmap">
{
  "imports": {
    "three": "./vendor/build/three.module.js",
    "three/addons/": "./vendor/examples/jsm/"
  }
}
</script>
<script type="module" src="./main.js"></script>
</body>
</html>
